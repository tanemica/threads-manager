<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf7f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="스레드관리">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>스레드 계정 관리</title>
<style>
/* 레이아웃: 계정마다 카드 1장. 큰 일차 숫자 → 진행바 → 2x2 오늘 현황 → 글 올림 버튼 */
:root{--bg:#faf7f2;--card:#ffffff;--tx:#222222;--sub:#8f8a80;--soft:#f3efe8;--pri:#222222;--prit:#ffffff;--ok:#2f9d62;--warn:#c98400;--bad:#e0472f;--sh:0 2px 12px #0000000d;--a1:#e8b84a;--a2:#f08a3c;--a3:#2f9d62;--a4:#7a5af0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#201f1d;--tx:#f2efe9;--sub:#8d887e;--soft:#2b2a27;--pri:#f2efe9;--prit:#141413;--ok:#4cc382;--warn:#f0b43a;--bad:#ff6a52;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141413;--card:#201f1d;--tx:#f2efe9;--sub:#8d887e;--soft:#2b2a27;--pri:#f2efe9;--prit:#141413;--ok:#4cc382;--warn:#f0b43a;--bad:#ff6a52;--sh:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Malgun Gothic",sans-serif;padding-block:0 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:520px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;padding:22px 4px 14px}
h1{font-size:22px;margin:0;letter-spacing:-.5px}
.hint{font-size:12px;color:var(--sub)}
.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:var(--sh);--ac:var(--a1)}
.s2{--ac:var(--a2)}.s3{--ac:var(--a3)}.s4{--ac:var(--a4)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.name{font-size:18px;font-weight:700;letter-spacing:-.3px;overflow-wrap:anywhere}
.stage{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub);margin-top:4px}
.stage:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ac)}
.day{text-align:right;line-height:1;white-space:nowrap}
.day b{font-size:40px;font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.day span{font-size:15px;color:var(--sub);margin-left:2px}
.bar{height:6px;background:var(--soft);border-radius:3px;margin:14px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.row2{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--sub)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 12px}
.tile{background:var(--soft);border-radius:14px;padding:11px 12px;display:flex;flex-direction:column;gap:2px;position:relative;border:0;text-align:left;color:var(--tx);font:inherit;min-width:0}
.tile small{font-size:12px;color:var(--sub);font-weight:400}
.tile b{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.tile b.warn{color:var(--warn)}.tile b.bad{color:var(--bad)}.tile b.full{color:var(--ok)}
.tile .m{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;background:var(--card);color:var(--sub);display:grid;place-items:center;font-size:16px}
.tile{padding-right:86px}
.pm{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;gap:6px}
.pmb{width:36px;height:36px;border-radius:50%;border:0;background:var(--card);color:var(--tx);font-size:18px;line-height:1;display:grid;place-items:center;padding:0}
.pmb:active{background:var(--pri);color:var(--prit)}
.order{display:flex;gap:4px;align-items:center}
.ob{width:30px;height:30px;border:0;border-radius:8px;background:var(--soft);color:var(--sub);font-size:11px;padding:0}
.ob:disabled{opacity:.3}
.ob:not(:disabled):active{background:var(--pri);color:var(--prit)}
.up{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;font-size:12px;color:var(--sub)}
.uc{background:var(--soft);border-radius:10px;padding:5px 4px 5px 10px;color:var(--tx);display:inline-flex;gap:2px;align-items:center}
.ux{border:0;background:none;color:var(--sub);font-size:16px;padding:0 6px;line-height:1}
input[type=checkbox]{width:auto;margin:0 8px 0 0}
label.chk{display:flex;align-items:center;margin:2px 0 12px;color:var(--tx);font-size:14px}
.swarn{color:var(--warn);font-size:13px;min-height:18px;margin-bottom:10px}
.nm{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.cap{display:block;font-size:11.5px;color:var(--sub);margin-bottom:2px}
.dayb{line-height:1;white-space:nowrap}
.dayb b{font-size:48px;font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.dayb span{font-size:16px;color:var(--sub);margin-left:3px}
.hr{text-align:right}
.cntb{line-height:1;white-space:nowrap}
.cntb b{font-size:48px;font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.cntb span{font-size:22px;color:var(--sub);margin-left:2px}
.cntb.full b{color:var(--ok)}.cntb.bad b{color:var(--bad)}
.remt{font-size:13px;font-weight:700;margin-top:4px}
.remt.full{color:var(--ok)}.remt.bad{color:var(--bad)}
.tm{background:var(--soft);border-radius:16px;padding:14px;text-align:center;margin-bottom:10px;display:flex;flex-direction:column;gap:2px}
.tbig{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.15}
.tsub{font-size:12.5px;color:var(--sub)}
.tm.wait .tbig{color:var(--warn)}.tm.ok .tbig{color:var(--ok);font-size:24px}.tm.full .tbig{color:var(--ok);font-size:24px}.tm.bad .tbig{color:var(--bad);font-size:24px}
.card{background:color-mix(in srgb,var(--ca,#999) 13%,var(--card));--soft:color-mix(in srgb,var(--ca,#999) 24%,var(--card))}
.cdot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--ca);margin-right:8px;vertical-align:-1px}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 16px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;background:var(--c);padding:0;box-shadow:0 0 0 1px #0002}
.sw[aria-pressed="true"]{border-color:var(--card);box-shadow:0 0 0 3px var(--tx)}
.timer{font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:12px;margin-bottom:10px;background:var(--soft)}
.timer.ok{color:var(--ok)}.timer.wait{color:var(--warn)}
.btns{display:flex;gap:8px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac,var(--pri));outline-offset:2px}
.btn{flex:1;border:0;border-radius:14px;padding:13px;font-weight:700;font-size:15px;background:var(--soft);color:var(--tx)}
.btn.pri{background:var(--pri);color:var(--prit)}
.more{display:flex;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--sub);font-size:12px;padding:6px 2px}
.link.danger{color:var(--bad)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--pri);color:var(--prit);border:0;border-radius:30px;padding:15px 26px;font-weight:700;font-size:15px;box-shadow:0 6px 20px #0003}
.empty{text-align:center;color:var(--sub);padding:80px 0;line-height:1.8}
dialog{border:0;border-radius:24px;padding:22px;width:calc(100% - 32px);max-width:400px;background:var(--card);color:var(--tx)}
dialog::backdrop{background:#0007}
dialog h2{margin:0 0 14px;font-size:18px}
label{font-size:12.5px;color:var(--sub)}
input{font:inherit;width:100%;padding:12px;border:0;border-radius:12px;background:var(--soft);color:var(--tx);margin:6px 0 14px}
.foot{display:flex;gap:8px}
</style>
</head>
<body>

<div class="wrap">
<header><h1>계정 관리</h1><span class="hint" id="cnt"></span></header>
<div id="list"></div>
</div>
<button class="fab" id="addBtn">＋ 계정 추가</button>

<dialog id="dlg">
  <h2 id="dTitle">새 계정</h2>
  <label for="fName">이름</label><input id="fName" placeholder="예: 재테크1">
  <label for="fDate">시작일 (계정 만든 날)</label><input id="fDate" type="date">
  <label>색상</label><div id="fColors" class="swatches"></div>
  <div class="foot"><button class="btn" id="dCancel">취소</button><button class="btn pri" id="dSave">저장</button></div>
</dialog>

<dialog id="sdlg">
  <h2>예약 추가</h2>
  <label for="sDate">날짜</label><input id="sDate" type="date">
  <label for="sTime">시간</label><input id="sTime" type="time">
  <label class="chk" for="sCp"><input id="sCp" type="checkbox">쿠팡 링크 글</label>
  <div id="sWarn" class="swarn"></div>
  <div class="foot"><button class="btn" id="sCancel">취소</button><button class="btn pri" id="sSave">예약 저장</button></div>
</dialog>

<script>
const STAGES=[
 {n:1,name:"오픈·웜업기",from:1,to:3,posts:1,gap:12,coupang:0,heart:3,comment:3},
 {n:2,name:"신뢰도 구축기",from:4,to:14,posts:3,gap:6,coupang:1,heart:3,comment:3},
 {n:3,name:"본격 성장기",from:15,to:89,posts:4,gap:4,coupang:4,heart:3,comment:3},
 {n:4,name:"90일 신뢰 계정",from:90,to:null,posts:4,gap:4,coupang:4,heart:3,comment:3}
];
const KEY="threads-mgr-v1";
const PAL=["#ef6f6c","#f2a33a","#8cc152","#3fbf9f","#4aa3df","#6f7ae0","#a468d8","#e86aa8"];
let pickColor=PAL[0];
let accs=load(), editId=null, delArm=null, ready=false, docRef=null, chain=Promise.resolve();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
// 저장: 브라우저 + 서버(db). 서버 저장이 되면 홈 화면 아이콘으로 열어도 데이터가 남는다.
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(accs))}catch(e){}
 
}
const $=id=>document.getElementById(id);
const ymd=d=>{const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())};
const today=()=>ymd(new Date());
function dayNum(start){const [y,m,d]=start.split("-").map(Number);const t=new Date();return Math.floor((new Date(t.getFullYear(),t.getMonth(),t.getDate())-new Date(y,m-1,d))/864e5)+1}
function stageOf(day){return STAGES.find(s=>day>=s.from&&(s.to==null||day<=s.to))||STAGES[0]}
function todayLog(a){if(a.date!==today()){a.date=today();a.heart=0;a.comment=0}const t0=new Date();t0.setHours(0,0,0,0);a.posts=a.posts.filter(p=>p.t>=t0.getTime());return a}
const get=id=>accs.find(x=>x.id===id);
function drawSw(){$("fColors").innerHTML=PAL.map(c=>`<button type="button" class="sw" style="--c:${c}" data-c="${c}" aria-label="색상 ${c}" aria-pressed="${c===pickColor}"></button>`).join("")}
function openDlg(id){editId=id||null;const a=id&&get(id);pickColor=a?(a.color||PAL[0]):(PAL.find(c=>!accs.some(x=>x.color===c))||PAL[accs.length%PAL.length]);drawSw();$("dTitle").textContent=a?"계정 수정":"새 계정";$("fName").value=a?a.name:"";$("fDate").value=a?a.start:today();$("dlg").showModal()}
function saveAcc(){const name=$("fName").value.trim(),start=$("fDate").value;if(!name||!start)return;
 if(editId){const a=get(editId);a.name=name;a.start=start;a.color=pickColor}else accs.push({id:Date.now(),name,start,color:pickColor,date:today(),posts:[],heart:0,comment:0});
 save();$("dlg").close();render()}
function del(id){if(delArm===id){accs=accs.filter(a=>a.id!==id);delArm=null;save()}else{delArm=id;setTimeout(()=>{if(delArm===id){delArm=null;render()}},3000)}render()}
function post(id,cp){const a=get(id);todayLog(a);a.posts.push({t:Date.now(),cp});save();render()}
function undo(id){const a=get(id);todayLog(a);a.posts.pop();save();render()}
function adj(id,k,d,e){if(e)e.stopPropagation();const a=get(id);todayLog(a);a[k]=Math.max(0,a[k]+d);save();render()}
function c(v,max){return v>max?"bad":v===max&&max>0?"full":""}
function fmt(ms){const m=Math.ceil(ms/60000),h=Math.floor(m/60);return h?h+"시간 "+(m%60)+"분":m+"분"}
function esc(s){return s.replace(/[&<>"]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[x]))}
function tile(label,v,max,cl,id,k){const btn=(d,t)=>`<button class="pmb" aria-label="${label} ${d>0?"+1":"-1"}" data-a="step" data-id="${id}" data-k="${k}" data-d="${d}">${t}</button>`;
 return `<div class="tile"><small>${label}</small><b class="${cl}">${v}<small> / ${max}</small></b><span class="pm">${btn(-1,"−")}${btn(1,"＋")}</span></div>`}
function step(id,k,d){const a=get(id);todayLog(a);
 if(k==="np"||k==="cp"){
  if(d>0)a.posts.push({t:Date.now(),cp:k==="cp"});
  else{for(let i=a.posts.length-1;i>=0;i--){if(k==="np"||a.posts[i].cp){a.posts.splice(i,1);break}}}
 }else a[k]=Math.max(0,a[k]+d);
 save();render()}
function move(id,d){const i=accs.findIndex(x=>x.id===id),j=i+d;if(i<0||j<0||j>=accs.length)return;[accs[i],accs[j]]=[accs[j],accs[i]];save();render()}
const z2=n=>String(n).padStart(2,"0");
function fmtT(t){const d=new Date(t),hm=z2(d.getHours())+":"+z2(d.getMinutes());return ymd(d)===today()?"오늘 "+hm:(d.getMonth()+1)+"/"+d.getDate()+" "+hm}
function dayNumOn(start,ds){const [y,m,d]=start.split("-").map(Number),[y2,m2,d2]=ds.split("-").map(Number);return Math.round((new Date(y2,m2-1,d2)-new Date(y,m-1,d))/864e5)+1}
let schedId=null;
function openSched(id){schedId=id;const d=new Date(Date.now()+36e5);$("sDate").value=ymd(d);$("sTime").value=z2(d.getHours())+":00";$("sCp").checked=false;checkSched();$("sdlg").showModal()}
function schedTs(){const [y,m,d]=$("sDate").value.split("-").map(Number),[h,mi]=($("sTime").value||"00:00").split(":").map(Number);return new Date(y,m-1,d,h,mi).getTime()}
function checkSched(){const a=get(schedId);if(!a||!$("sDate").value){$("sWarn").textContent="";return}
 const ts=schedTs(),ds=$("sDate").value,cp=$("sCp").checked,s=stageOf(dayNumOn(a.start,ds)),w=[];
 const same=a.posts.filter(p=>ymd(new Date(p.t))===ds);
 if(same.length+1>s.posts)w.push("그날 글 한도("+s.posts+"개)를 넘어요");
 if(cp&&same.filter(p=>p.cp).length+1>s.coupang)w.push(s.coupang===0?"그 단계에는 쿠팡 글이 금지예요":"그날 쿠팡 글 한도("+s.coupang+"개)를 넘어요");
 if(same.some(p=>Math.abs(p.t-ts)<s.gap*36e5))w.push("다른 글과 "+s.gap+"시간 이내예요");
 $("sWarn").textContent=w.length?"⚠ "+w.join(" · "):""}
function saveSched(){const a=get(schedId);if(!a||!$("sDate").value)return;a.posts.push({t:schedTs(),cp:$("sCp").checked,sched:true});save();$("sdlg").close();render()}
function render(){
 $("cnt").textContent=accs.length?accs.length+"개 계정":"";
 if(!accs.length){$("list").innerHTML=ready?'<div class="empty">아직 계정이 없어요<br>아래 버튼으로 첫 계정을 추가하세요</div>':'<div class="empty">불러오는 중…</div>';return}
 let ch=false;
 $("list").innerHTML=accs.map((a,i)=>{
  todayLog(a);
  if(!a.color){a.color=PAL[i%PAL.length];ch=true}const col=a.color;
  const day=dayNum(a.start),s=stageOf(day);
  const todays=a.posts.filter(p=>ymd(new Date(p.t))===today()),np=todays.length,cp=todays.filter(p=>p.cp).length;
  const up=a.posts.filter(p=>p.t>Date.now()).sort((x,y)=>x.t-y.t);
  const upHtml=up.length?`<div class="up"><small>예약 대기 ${up.length}개</small>${up.map(p=>`<span class="uc">${fmtT(p.t)}${p.cp?" 쿠팡":""}<button class="ux" aria-label="예약 취소" data-a="unsched" data-id="${a.id}" data-t="${p.t}">×</button></span>`).join("")}</div>`:"";
  const pct=s.to?Math.min(100,Math.max(0,(day-s.from+1)/(s.to-s.from+1)*100)):100;
  const left=s.to?`다음 단계까지 ${s.to-day+1}일`:"최종 단계";
  const last=np?Math.max(...todays.map(p=>p.t)):null,remain=last?last+s.gap*36e5-Date.now():0;
  const rem=s.posts-np,nextAt=last?last+s.gap*36e5:null;
  const clock=t=>{const d=new Date(t),h=d.getHours();return (h<12?"오전 ":"오후 ")+((h%12)||12)+":"+z2(d.getMinutes())};
  const timer=np>s.posts?`<div class="tm bad"><div class="tbig">한도 ${np-s.posts}개 초과</div><div class="tsub">오늘 글 한도는 ${s.posts}개예요</div></div>`
   :np===s.posts?`<div class="tm full"><div class="tbig">오늘 목표 완료</div><div class="tsub">글 ${s.posts}개를 모두 채웠어요</div></div>`
   :remain>0?`<div class="tm wait"><div class="tsub">다음 글까지</div><div class="tbig">${fmt(remain)}</div><div class="tsub">${clock(nextAt)}부터 가능</div></div>`
   :`<div class="tm ok"><div class="tbig">지금 올릴 수 있어요</div><div class="tsub">${last?"마지막 글 후 "+s.gap+"시간이 지났어요":"오늘 첫 글이에요"}</div></div>`;
  const remTxt=rem>0?rem+"개 더 써야 해요":rem===0?"오늘 목표 완료":(-rem)+"개 초과";
  const rule=`최소 ${s.gap}시간 간격${s.n===2?" · 하루 2~3개":""}`;
  return `<div class="card s${s.n}" style="--ca:${col}">
   <div class="nm"><span class="name"><i class="cdot"></i>${esc(a.name)}</span><div class="order"><button class="ob" aria-label="위로" data-a="move" data-id="${a.id}" data-d="-1"${i===0?" disabled":""}>▲</button><button class="ob" aria-label="아래로" data-a="move" data-id="${a.id}" data-d="1"${i===accs.length-1?" disabled":""}>▼</button></div></div>
   <div class="hero">
    <div class="hl"><small class="cap">계정 운영</small><div class="dayb"><b>${day}</b><span>일차</span></div><div class="stage">${s.n}단계 · ${s.name}</div></div>
    <div class="hr"><small class="cap">오늘 쓴 글</small><div class="cntb ${c(np,s.posts)}"><b>${np}</b><span>/${s.posts}</span></div><div class="remt ${rem<0?"bad":rem===0?"full":""}">${remTxt}</div></div>
   </div>
   <div class="bar"><i style="width:${pct}%"></i></div>
   <div class="row2"><span>${left}</span><span>${rule}</span></div>
   <div class="grid">
    ${tile("오늘 글",np,s.posts,c(np,s.posts),a.id,"np")}
    ${tile("쿠팡 글",cp,s.coupang===0?"금지":s.coupang,s.coupang===0?(cp?"bad":""):c(cp,s.coupang),a.id,"cp")}
    ${tile("하트",a.heart,s.heart,c(a.heart,s.heart),a.id,"heart")}
    ${tile("댓글",a.comment,s.comment,c(a.comment,s.comment),a.id,"comment")}
   </div>
   ${timer}${upHtml}
   <div class="btns"><button class="btn pri" data-a="post" data-id="${a.id}">글 올림</button>${s.coupang?`<button class="btn" data-a="post" data-id="${a.id}" data-cp="1">쿠팡 글 올림</button>`:""}</div>
   <div class="btns" style="margin-top:8px"><button class="btn" data-a="sched" data-id="${a.id}">예약 추가</button></div>
   <div class="more"><span><button class="link" data-a="undo" data-id="${a.id}">마지막 글 취소</button></span><span><button class="link" data-a="edit" data-id="${a.id}">수정 (시작 ${a.start})</button> <button class="link danger" data-a="del" data-id="${a.id}">${delArm===a.id?"한 번 더 누르면 삭제":"삭제"}</button></span></div>
  </div>`}).join("");
 if(ch)save();
}
$("list").addEventListener("click",e=>{
 const t=e.target.closest("[data-a]");if(!t)return;
 const id=+t.dataset.id,a=t.dataset.a;
 if(a==="adj"){adj(id,t.dataset.k,+t.dataset.d,e)}
 else if(a==="sched")openSched(id);
 else if(a==="unsched"){const a2=get(id);a2.posts=a2.posts.filter(p=>String(p.t)!==t.dataset.t);save();render()}
 else if(a==="move")move(id,+t.dataset.d);
 else if(a==="step")step(id,t.dataset.k,+t.dataset.d);
 else if(a==="post")post(id,!!t.dataset.cp);
 else if(a==="undo")undo(id);
 else if(a==="edit")openDlg(id);
 else if(a==="del")del(id);
});
$("addBtn").onclick=()=>openDlg();
$("dCancel").onclick=()=>$("dlg").close();
$("dSave").onclick=saveAcc;
$("fColors").addEventListener("click",e=>{const b=e.target.closest(".sw");if(!b)return;pickColor=b.dataset.c;drawSw()});
$("sCancel").onclick=()=>$("sdlg").close();
$("sSave").onclick=saveSched;
["sDate","sTime","sCp"].forEach(id=>$(id).addEventListener("change",checkSched));
ready=true;render();setInterval(render,30000);
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body>
</html>
